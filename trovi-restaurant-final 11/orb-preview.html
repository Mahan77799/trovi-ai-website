<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trovi Signature Orb Preview</title>
  <link rel="stylesheet" href="css/restaurants.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fcfcfb;font-family:Arial,sans-serif;color:#151515}
    .preview{display:grid;justify-items:center;gap:26px}.preview h1{margin:0;font-size:24px}.preview p{margin:0;color:#777}
    .rr-agent-orb{width:min(520px,76vw)!important;height:min(520px,76vw)!important}
    .rr-agent-card--single .rr-agent-orb--ocean button{width:19%!important;height:19%!important}
  </style>
</head>
<body>
  <main class="preview rr-agent-card--single">
    <h1>Trovi signature liquid orb</h1>
    <div class="rr-agent-orb rr-agent-orb--ocean">
      <span class="rr-orb-media" aria-hidden="true"></span>
      <button type="button" aria-label="Play Trovi demo"><b aria-hidden="true">▶</b></button>
    </div>
    <p>Open this file through Live Server to review the full-size animation.</p>
  </main>
  <script src="js/liquid-orbs.js"></script>
</body>
</html>
